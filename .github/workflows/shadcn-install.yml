name: Install shadcn ERP primitives

on:
  push:
    branches:
      - feature/common-button
    paths:
      - .github/workflows/shadcn-install.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      npm_config_package_lock: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/common-button

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install project dependencies
        run: npm install --package-lock=false

      - name: Add remaining ERP shadcn primitives
        run: npx shadcn add field --yes

      - name: Typecheck generated primitives
        run: npm run typecheck

      - name: Commit generated primitives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json components.json src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: install ERP shadcn primitives"
          git push origin HEAD:feature/common-button
